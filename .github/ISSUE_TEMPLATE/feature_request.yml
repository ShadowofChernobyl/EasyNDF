name: Feature request
description: An idea for something EasyNDF could do, or do better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the open issues first, in case someone has suggested it already.

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What EasyNDF should do.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What it's for
      description: The modding task it would help with, and how you do it today.
    validations:
      required: true

  - type: dropdown
    id: tab
    attributes:
      label: Where in EasyNDF
      multiple: true
      options:
        - Files
        - Mods
        - Editor
        - Armory
        - Settings
        - Help
        - Somewhere new

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - WARNO
        - Steel Division 2
        - Both

  - type: textarea
    id: extra
    attributes:
      label: Pictures or examples
      description: A sketch, a screenshot of something similar, or the .ndf text it's about. Drag files into this box.
